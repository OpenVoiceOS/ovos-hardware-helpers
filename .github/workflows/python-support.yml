name: Python Version Support

on:
  push:
    branches: [dev]
    paths:
      - 'ovos_hardware_helpers/**'
      - 'test/**'
      - 'pyproject.toml'
      - '.github/workflows/python-support.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'ovos_hardware_helpers/**'
      - 'test/**'
      - 'pyproject.toml'
      - '.github/workflows/python-support.yml'
  workflow_dispatch:

jobs:
  python_support:
    uses: OpenVoiceOS/gh-automations/.github/workflows/python-support.yml@dev
    secrets: inherit
    with:
      test_path: 'test/unittests'
      coverage_source: 'ovos_hardware_helpers'
      python_versions: '["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]'
