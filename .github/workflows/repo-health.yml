name: Repository Health

on:
  push:
    branches: [dev]
    paths:
      - '**'
  pull_request:
    branches: [dev]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays
  workflow_dispatch:

jobs:
  repo_health:
    uses: OpenVoiceOS/gh-automations/.github/workflows/repo-health.yml@dev
    secrets: inherit
