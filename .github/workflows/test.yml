name: Run Tests

on:
  push:
    branches: [dev]
    paths:
      - 'ovos_hardware_helpers/**'
      - 'test/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'ovos_hardware_helpers/**'
      - 'test/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  test:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    secrets: inherit
    with:
      test_path: 'test/unittests'
      coverage_source: 'ovos_hardware_helpers'
      min_coverage: 90
      pr_comment: true
