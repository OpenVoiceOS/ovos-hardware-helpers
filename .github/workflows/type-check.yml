name: Type Check

on:
  push:
    branches: [dev]
    paths:
      - 'ovos_hardware_helpers/**'
      - '.github/workflows/type-check.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'ovos_hardware_helpers/**'
      - '.github/workflows/type-check.yml'
  workflow_dispatch:

jobs:
  type_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/type-check.yml@dev
    secrets: inherit
    with:
      pr_comment: true
